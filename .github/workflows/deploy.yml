name: Deploy to Pages

# Publishes playgalaxeed.com to the gh-pages branch: the landing page (site/) at the
# root and the game (www/) under /play/. www/ stays in place for the Vite/Capacitor build.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Not shared with the preview workflows: a group keeps only one pending run, so a
# shared group cancels runs. gh-pages push conflicts are retried by the action.
concurrency:
  group: gh-pages-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # site/CNAME must be part of every deploy: the action deletes files it doesn't
      # publish, and GitHub drops the custom domain when CNAME disappears.
      # privacy.html is also copied to the root, the URL given to the stores.
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R www _site/play
          cp www/privacy.html _site/privacy.html
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: |
            pr-preview
            branch-preview
