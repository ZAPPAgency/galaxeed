<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Galaxeed</title>
  <meta name="description" content="Des astéroïdes aux trous noirs : faites grandir votre grille cosmique, réveillez les Dieux du Cosmos et déclenchez le Big Bang. Bientôt sur iPhone et Android." />
  <meta name="theme-color" content="#0a0620" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://playgalaxeed.com/" />
  <meta property="og:title" content="Galaxeed" />
  <meta property="og:description" content="Fusionnez. Produisez. Explosez. Recommencez plus fort." />
  <meta property="og:image" content="https://playgalaxeed.com/play/social-share.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="play/favicon.png" />
  <link rel="apple-touch-icon" href="play/apple-touch-icon.png" />
  <style>
    /* Same palette as the game (www/css/style.css). */
    :root {
      --bg-deep: #05040d;
      --accent: #8b5cf6;
      --text: #f1eefc;
      --text-soft: #c9c3f0;
      --text-dim: #9089b8;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      background: radial-gradient(ellipse at 70% 25%, #241a52 0%, #130d33 45%, var(--bg-deep) 100%) var(--bg-deep);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 0 24px;
    }
    .icon {
      width: 112px;
      height: 112px;
      border-radius: 25px;
      box-shadow: 0 12px 40px rgba(139, 92, 246, 0.45);
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 14vw, 84px);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
    }
    .tagline { margin: 0; color: var(--text-soft); font-size: 20px; font-weight: 500; line-height: 1.4; }
    .pitch { margin: 0; color: var(--text-dim); font-size: 16px; line-height: 1.55; }
    .stores { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
    .store {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 132px; /* two buttons still fit side by side on a 320px screen */
      padding: 10px 18px;
      border: 1px solid rgba(241, 238, 252, 0.25);
      border-radius: var(--radius);
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.3;
    }
    .store strong { color: var(--text); font-size: 17px; }
    .play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 32px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
      transition: transform 0.1s;
    }
    .play:active { transform: scale(0.97); }
    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 24px; padding-bottom: 16px; font-size: 14px; }
    footer a { display: inline-flex; align-items: center; min-height: 44px; color: var(--text-dim); }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="play/icon-512.png" alt="" width="112" height="112" />
    <h1>Galaxeed</h1>
    <p class="tagline">Fusionnez. Produisez. Explosez.<br />Recommencez plus fort.</p>
    <p class="pitch">Des astéroïdes aux trous noirs : faites grandir votre grille cosmique, réveillez les Dieux du Cosmos et déclenchez le Big Bang.</p>
    <!-- Not links until launch: then swap in the official store badges (MKT-01 in docs/LAUNCH_PLAN.md). -->
    <div class="stores">
      <span class="store">Bientôt sur<strong>l'App Store</strong></span>
      <span class="store">Bientôt sur<strong>Google Play</strong></span>
    </div>
    <a class="play" href="play/">Jouer sur le web</a>
  </main>
  <footer>
    <a href="privacy.html">Confidentialité</a>
    <a href="mailto:contact@playgalaxeed.com">contact@playgalaxeed.com</a>
  </footer>
</body>
</html>
